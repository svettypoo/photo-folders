name: iOS build
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install xcodegen
          ls /Applications | grep -i xcode
          XC=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Generate project
        run: xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(k,x) for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone 16 Pro') or x['name'].startswith('iPhone 16')]
          if not c: c=[(k,x) for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          c.sort(key=lambda t:(t[0], t[1]['name']))
          print(c[-1][1]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
      - name: Unit tests
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild build-for-testing -project PhotoFolders.xcodeproj -scheme PhotoFolders \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/build.log | grep -E "error:|\*\* TEST BUILD" || true
          xcodebuild test-without-building -project PhotoFolders.xcodeproj -scheme PhotoFolders \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/dd -only-testing:PhotoFoldersTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/test.log | grep -E "error:|warning: .*PhotoFolders/|Test Case .*(passed|failed)|PERF|XCTAssert|\*\* (TEST|BUILD)" || true
          grep -qE "\*\* TEST (EXECUTE )?SUCCEEDED \*\*" build/test.log
      - name: Walk the app on a simulator with real photos
        continue-on-error: true
        run: ./scripts/ci-sim-screens.sh "${{ steps.sim.outputs.udid }}" build/shots
      - name: Device build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project PhotoFolders.xcodeproj -scheme PhotoFolders -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build/ddr \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build/device.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build/device.log
          mkdir -p build/ipa/Payload
          cp -R build/ddr/Build/Products/Release-iphoneos/PhotoFolders.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../PhotoFolders-unsigned.ipa Payload)
          ls -la build/PhotoFolders-unsigned.ipa
      - name: TestFlight upload (runs once the Apple upload key is stored)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "No Apple upload key stored yet: skipping TestFlight."; exit 0
          fi
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild archive -project PhotoFolders.xcodeproj -scheme PhotoFolders -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/PhotoFolders.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" $AUTH 2>&1 | tee build/archive.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" build/archive.log
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/PhotoFolders.xcarchive -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist $AUTH 2>&1 | tee build/upload.log | grep -E "error:|Upload|EXPORT" || true
          grep -q "EXPORT SUCCEEDED" build/upload.log
          echo "Uploaded build ${{ github.run_number }} to TestFlight."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-folders-build
          path: |
            build/test.log
            build/build.log
            build/walk.log
            build/device.log
            build/archive.log
            build/upload.log
            build/shots
            build/PhotoFolders-unsigned.ipa
          if-no-files-found: ignore
