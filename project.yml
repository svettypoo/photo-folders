name: PhotoFolders
options:
  bundleIdPrefix: com.stproperties
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PhotoFolders:
    type: application
    platform: iOS
    sources:
      - PhotoFolders
    info:
      path: PhotoFolders/Info.plist
      properties:
        CFBundleDisplayName: Photo Folders
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryUsageDescription: Photo Folders looks at the photos on this iPhone to sort them into folders and make them searchable. Nothing leaves your phone.
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.stproperties.photofolders.index
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stproperties.photofolders
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  PhotoFoldersTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PhotoFoldersTests
    dependencies:
      - target: PhotoFolders
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.stproperties.photofolders.tests
  PhotoFoldersUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PhotoFoldersUITests
    dependencies:
      - target: PhotoFolders
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.stproperties.photofolders.uitests
        TEST_TARGET_NAME: PhotoFolders
schemes:
  PhotoFolders:
    build:
      targets:
        PhotoFolders: all
        PhotoFoldersTests: [test]
        PhotoFoldersUITests: [test]
    test:
      config: Debug
      targets:
        - PhotoFoldersTests
        - PhotoFoldersUITests
